[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cua-takehome"
version = "0.1.0"
description = "Discover-once, replay-deterministically computer-use automation for legacy back-office UIs"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40",
    "playwright>=1.45",
    "pydantic>=2.6",
    "flask>=3.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cua = "cua.cli:main"

[tool.setuptools.packages.find]
include = ["cua*", "mock_app*"]

[tool.setuptools.package-data]
mock_app = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
