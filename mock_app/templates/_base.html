<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>{% block title %}Member Services{% endblock %}</title>
<style type="text/css">
body { font-family: Verdana, Arial, sans-serif; font-size: 11px; background: #f4f4ec; margin: 8px; }
td { font-size: 11px; }
.h9 { background: #334477; color: #ffffff; font-weight: bold; font-size: 12px; }
.z4 { background: #e4e4d6; font-weight: bold; }
.q0 { border: 1px solid #888888; background: #ffffff; }
.r2 { color: #cc0000; font-weight: bold; }
.g5 { color: #006600; font-weight: bold; }
.b7 { font-family: Verdana, Arial, sans-serif; font-size: 11px; }
.ov3 { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.45); z-index: 50; }
.mb1 { margin: 120px auto 0 auto; background: #ece9d8; border: 2px outset #ffffff; }
</style>
</head>
<body>
{% block body %}{% endblock %}
{% if g.interstitial %}
<div class="ov3">
<table class="mb1" width="380" cellpadding="8" cellspacing="0">
<tr><td class="h9">System Notice</td></tr>
<tr><td>Scheduled maintenance will occur tonight between 11:00 PM and 2:00 AM ET.
Please complete open transactions before that time.</td></tr>
<tr><td align="center"><input type="button" value="OK" class="b7" onclick="this.closest('.ov3').style.display='none'"></td></tr>
</table>
</div>
{% endif %}
</body>
</html>
