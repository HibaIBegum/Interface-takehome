<!DOCTYPE HTML PUBLIC "-//W3C//DTD HTML 4.01 Transitional//EN">
<html>
<head>
<title>First Fictional Credit Union - Sign On</title>
<script type="text/javascript">
if (window.top !== window.self) { window.top.location.href = window.location.href; }
</script>
<style type="text/css">
body { font-family: Verdana, Arial, sans-serif; font-size: 11px; background: #d8d8c8; }
td { font-size: 11px; }
.h9 { background: #334477; color: #ffffff; font-weight: bold; font-size: 12px; }
.q0 { border: 1px solid #888888; background: #ffffff; }
.r2 { color: #cc0000; font-weight: bold; }
.w8 { background: #fff3c4; border: 1px solid #c9a400; }
</style>
</head>
<body>
<br><br>
<center>
{% if expired %}
<table class="w8" width="340" cellpadding="6" cellspacing="0"><tr><td>Your session has expired. Please sign on again.</td></tr></table><br>
{% endif %}
<form method="post" action="/login">
<table class="q0" width="340" cellpadding="5" cellspacing="0">
<tr><td class="h9" colspan="2">FIRST FICTIONAL CREDIT UNION<br>Member Services Sign On</td></tr>
{% if error %}<tr><td colspan="2" class="r2">{{ error }}</td></tr>{% endif %}
<tr><td width="100">User ID:</td><td><input type="text" name="uid" size="20"></td></tr>
<tr><td>Password:</td><td><input type="password" name="pwd" size="20"></td></tr>
<tr><td></td><td><input type="submit" value="Sign On"></td></tr>
</table>
</form>
<font size="1" color="#666666">Authorized use only. Activity is monitored.</font>
</center>
</body>
</html>
